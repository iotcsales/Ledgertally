  <!-- Two-tier icon strategy: the detailed navy/gold "LedgerTally" artwork
       (ledger book, chart, coins) is used everywhere it has room to read
       clearly - PWA install icon, iOS home screen, app drawer. Below ~48px

       browser-tab favicons (16/32/.ico) use a simplified flat "LT" monogram
       in the same navy/gold instead - a deliberate size-based split, not an
       inconsistency. -->
  <link rel="icon" type="image/png" href="./favicon.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png" />
