<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="LedgerTally — bookkeeping and tax export for indie digital sellers. Import Etsy and Gumroad payouts, reconcile revenue, export Schedule C / GST-ready tax summaries. No subscription, no cloud storage." />
  <title>LedgerTally — Bookkeeping for Indie Sellers</title>

  <!-- Two-tier icon strategy: the detailed navy/gold "LedgerTally" artwork
       (ledger book, chart, coins) is used everywhere it has room to read
       clearly - PWA install icon, iOS home screen, app drawer. Below ~48px
       that level of detail turns to a smudge on any photorealistic mark, so
       browser-tab favicons (16/32/.ico) use a simplified flat "LT" monogram
       in the same navy/gold instead - a deliberate size-based split, not an
       inconsistency. -->
  <link rel="icon" type="image/png" href="./favicon.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="./touch-icon-v2.png" />
  <meta name="theme-color" content="#1B2A4A" />
  <!-- These four tags were the actual missing piece, found by comparing
       against Dealtally's working index.html (same phone, same iOS,
       favicon confirmed working on Home Screen). Without
       apple-mobile-web-app-capable specifically, iOS can still render a
       correct PREVIEW of the touch icon (since that's just normal page
       rendering) while still falling back to a generic icon for the actual
       Home Screen shortcut it creates - which matches exactly the symptom
       reported. -->
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="LedgerTally" />

  <script type="module" crossorigin src="./app.js"></script>
  <link rel="stylesheet" crossorigin href="./app.css" />
</head>
<body>
  <div id="app"></div>
</body>
</html>
